<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*block to inline using display and vice versa*/
        h2{
            display: inline;
            border: 3px solid red;
            margin: 4px;
            width: 100px;
            height: 100px;
            /* we cannot give width and height for 
            inline block elements the height and width 
            are fixed Permenantly..instead use display: inline-block*/
        }

        .span1{
            display: block;
            border: 4px solid blue;
            width: 200px;
            height: 100px;
            margin: 5px;
        }

    </style>
</head>
<body>
    <!--Block element(\n)-->
    <h1>Hello</h1>
    <h1>Pyspiders</h1><hr>

    <!--Inline Elemnet(in same line)-->
    <span>Hello</span>
    <span>pyspiders</span><hr><hr>

    <!-- Block to inline element-->
     <h2>BTM BENGALURU</h2>
     <h2>BTM BENGALURU</h2>
     <h2>BTM BENGALURU</h2>
     <h2>BTM BENGALURU</h2><hr>
  

     <!--inline to Block element-->
     <span class="span1">HUT Living Space</span>
     <span class="span1">HUT Living Space</span>
     <span class="span1">HUT Living Space</span>
     <span class="span1">HUT Living Space</span>
     
 </body>

</html>
