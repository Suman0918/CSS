<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }

        .wrap-1{
            width: 100%;

        }

    <div class="wrap-1"></div>
    <div class="wrap-2"></div>
</body>
</html>
