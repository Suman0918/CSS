<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-size: 2rem;
            color: blue;

            border-width: 9px;
            border-style: solid;
            border-color: black;
            /* in css if there are multiple properties the 
            last properties are executed */
            border: 4px double black;
            
            padding-top: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
            padding-left: 315px;
            /* 4 values in clockwise t,r,b,l */
            padding: 0px 0px 0px 0px;
            /* 2 values (t,b) and (r,l) */
            padding: 10px 30px;
            /* 1 value for all t,r,b,l */
            padding: 100px;

            /* same syntax for margin */
            margin:50px 10px 30px 10px ;
        
        }
    </style>
</head>
<body>
    <h1>Bengaluru , India</h1>
</body>
</html>
