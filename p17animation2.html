<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        .main{
            width: 100%;
            height: 97vh;
            display: flex;
            justify-content: center;
            align-items: center;
           
        }
        .ball{
            width: 90px;
            height: 90px;
            border: 2px solid black;
            border-radius: 50%;
            background-color: greenyellow;
            animation: bounce 1000ms ease-in-out alternate infinite;
        }
        @keyframes bounce {
            from{
                transform: translateY(-180px);
            }
            t0{
                transform: translateY(180px);
               background-color: aqua;
            }
        }

        .main>.ball:nth-child(1){
            animation-delay: 100ms;
        }
        .main>.ball:nth-child(2){
            animation-delay: 200ms;
        }
        .main>.ball:nth-child(3){
            animation-delay: 300ms;
        }
        .main>.ball:nth-child(4){
            animation-delay: 400ms;
        }
        .main>.ball:nth-child(5){
            animation-delay: 500ms;
        }
        .main>.ball:nth-child(6){
            animation-delay: 600ms;
        }
        .main>.ball:nth-child(7){
            animation-delay: 700ms;
        }


    </style>
</head>
<body>
   <div class="main">
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
   </div>
</body>
</html>
