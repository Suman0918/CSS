<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* Main Class */
        .head{
            font-size: 5rem;
            margin: 50px;
        }
        /*Sub Classes*/
        .head-1{
            opacity: 0;
        }

        .head-2{
            opacity: 0.2;
        }

        .head-3{
            opacity: 0.4;
        }

        .head-4{
            opacity: 0.6;
        }

        .head-5{
            opacity: 0.8;
        }

        .head-6{
            opacity: 1;
        }


    </style>
</head>
<body align="center">
    <!-- Sub Class -->
     <!-- class="main class name and sub class name"-->
     <h1 class="head head-1">PYSPIDERS</h1>
     <h1 class="head head-2">PYSPIDERS</h1>
     <h1 class="head head-3">PYSPIDERS</h1>
     <h1 class="head head-4">PYSPIDERS</h1>
     <h1 class="head head-5">PYSPIDERS</h1>
     <h1 class="head head-6">PYSPIDERS</h1>
    
</body>
</html>
